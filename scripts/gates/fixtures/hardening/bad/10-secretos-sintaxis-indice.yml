# gate-expect: secrets-untrusted
# Fixture NEGATIVO: el MISMO secreto del fixture 08, leido con la sintaxis de
# indice `secrets['NOMBRE']`. GitHub documenta las dos sintaxis de acceso a un
# contexto (property dereference e index) y ambas devuelven el secreto, asi que
# mirar solo `secrets.NOMBRE` dejaba una via limpia para colar un secreto en un
# workflow alcanzable desde un fork.
name: bad-secrets-index
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_KEY: ${{ secrets['BOT_APP_PRIVATE_KEY'] }}
    steps:
      - run: echo "$APP_KEY" > /dev/null
