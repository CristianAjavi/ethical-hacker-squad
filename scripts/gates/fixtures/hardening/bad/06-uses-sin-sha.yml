# gate-expect: uses-pin
# NEGATIVE fixture: third-party action pinned to a mutable tag.
name: bad-uses-tag
on:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: some/action@main
      - uses: docker://alpine:3.20
