# gate-expect: secrets-untrusted
# NEGATIVE fixture: `toJSON(secrets)` dumps the WHOLE secrets context without
# naming a single one. It is the quietest way to exfiltrate from a workflow a
# third party can trigger.
name: bad-secrets-tojson
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo '${{ toJSON(secrets) }}' > /dev/null
