# gate-expect: secrets-untrusted
# NEGATIVE fixture: the SAME secret as fixture 08, read through the index
# syntax `secrets['NAME']`. GitHub documents two syntaxes for reading a context
# (property dereference and index) and both return the secret, so looking only
# at `secrets.NAME` left a clean path to smuggle a secret into a workflow that
# is reachable from a fork.
name: bad-secrets-index
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_KEY: ${{ secrets['BOT_APP_PRIVATE_KEY'] }}
    steps:
      - run: echo "$APP_KEY" > /dev/null
