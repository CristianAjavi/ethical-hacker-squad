# gate-expect: secrets-untrusted
# NEGATIVE fixture: a job holding secrets that is reachable from a fork.
name: bad-secrets-pr
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "$APP_KEY" > /dev/null
