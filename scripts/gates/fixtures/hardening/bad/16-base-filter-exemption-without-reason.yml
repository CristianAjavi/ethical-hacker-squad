# gate-expect: pr-base-filter
# NEGATIVE fixture: the exemption marker with nothing after it. An escape hatch
# nobody has to justify is the filter again with extra steps, so a bare marker
# does not exempt.
name: bad-pr-base-filter-bare-marker
on:
  pull_request:
    branches: [main]  # hardening-allow: base-filter
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gates/run-all.sh
