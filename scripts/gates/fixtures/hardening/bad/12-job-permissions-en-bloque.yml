# gate-expect: job-permissions-broad
# Fixture NEGATIVO: el trabajo SI declara `permissions:`, pero lo hace en bloque.
# La regla no es "declarar permisos", es "permisos MINIMOS por trabajo": un
# `write-all` es precisamente la concesion que la regla existe para impedir.
name: bad-job-permissions-broad
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: echo hola
