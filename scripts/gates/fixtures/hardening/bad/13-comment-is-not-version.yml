# gate-expect: uses-comment
# NEGATIVE fixture: there is a comment next to the SHA, but it is not a
# version. The pin ends up without the tag Dependabot needs to propose the
# update, which is precisely why the comment is required.
name: bad-uses-comment-no-version
on:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 0
        with:
          persist-credentials: false
