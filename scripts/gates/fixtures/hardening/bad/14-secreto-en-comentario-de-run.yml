# gate-expect: secrets-untrusted
# Fixture NEGATIVO: el secreto esta "comentado" dentro de un bloque `run:`.
# No sirve de nada: GitHub expande `${{ }}` ANTES de entregarle el script al
# shell, asi que la almohadilla no protege nada y el valor acaba en el log.
# El escaner ignora la prosa de los comentarios YAML, pero NO puede ignorar un
# comentario que lleva plantilla dentro.
name: bad-secreto-comentado
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo iniciando
          # depuracion: ${{ secrets.BOT_APP_PRIVATE_KEY }}
