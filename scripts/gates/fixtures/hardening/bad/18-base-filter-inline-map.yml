# gate-expect: pr-base-filter
# NEGATIVE fixture: the same filter written as a one-line flow map. The body never
# gets a line of its own, so a parser that only reads indented children would call
# this file clean.
name: bad-pr-base-filter-inline
on:
  pull_request: {branches: [main]}
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gates/run-all.sh
