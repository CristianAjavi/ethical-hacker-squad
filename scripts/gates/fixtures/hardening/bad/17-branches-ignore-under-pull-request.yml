# gate-expect: pr-base-filter
# NEGATIVE fixture: `branches-ignore` is the same filter written the other way
# round, and it is still read against the BASE branch. Naming only `branches` in
# the rule would leave the identical defect one word away from the check.
name: bad-pr-base-filter-ignore
on:
  pull_request:
    branches-ignore:
      - 'loop/**'
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gates/run-all.sh
