# gate-expect: uses-comment
# Fixture NEGATIVO: hay comentario junto al SHA, pero no es una version. El pin
# queda sin la etiqueta que Dependabot necesita para proponer la actualizacion,
# que es justamente la razon por la que se exige el comentario.
name: bad-uses-comment-no-version
on:
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 0
        with:
          persist-credentials: false
