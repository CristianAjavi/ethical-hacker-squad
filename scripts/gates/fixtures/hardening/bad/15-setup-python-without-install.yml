# gate-expect: setup-python-bare
# NEGATIVE fixture: the shape that cost a whole CI run. The job installs its
# own Python and never installs a package, so it runs on a CLEAN interpreter
# while the code under it expects the runner image's, which carries PyYAML from
# the distribution package. Nothing breaks here - it breaks three steps later,
# and it looks like a defect in the thing being measured.
name: bad-setup-python-bare
on:
  push:
    branches: [main]
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the suite
        run: |
          bash scripts/run-batteries.sh
