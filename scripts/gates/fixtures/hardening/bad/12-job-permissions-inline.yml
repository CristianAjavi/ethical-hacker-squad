# gate-expect: job-permissions-broad
# NEGATIVE fixture: the job DOES declare `permissions:`, but grants them in
# bulk. The rule is not "declare permissions", it is "MINIMUM permissions per
# job": a `write-all` is exactly the grant this rule exists to block.
name: bad-job-permissions-broad
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - run: echo hello
