# gate-expect: secrets-untrusted
# Fixture NEGATIVO: `toJSON(secrets)` vuelca el contexto ENTERO de secretos sin
# nombrar ninguno. Es la forma mas silenciosa de exfiltrar en un workflow que un
# tercero puede disparar.
name: bad-secrets-tojson
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo '${{ toJSON(secrets) }}' > /dev/null
