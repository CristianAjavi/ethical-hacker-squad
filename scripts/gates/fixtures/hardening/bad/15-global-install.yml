# gate-expect: global-install
# Issue #17, as it was: a global install of a tag inside a job that can write.
name: release
on:
  workflow_dispatch:
permissions: {}
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
