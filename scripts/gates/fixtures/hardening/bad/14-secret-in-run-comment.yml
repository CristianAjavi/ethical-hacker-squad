# gate-expect: secrets-untrusted
# NEGATIVE fixture: the secret is "commented out" inside a `run:` block.
# That does nothing: GitHub expands `${{ }}` BEFORE handing the script to the
# shell, so the hash sign protects nothing and the value lands in the log.
# The scanner ignores prose in YAML comments, but it cannot ignore a comment
# carrying a template inside.
name: bad-commented-out-secret
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo starting
          # debug: ${{ secrets.BOT_APP_PRIVATE_KEY }}
