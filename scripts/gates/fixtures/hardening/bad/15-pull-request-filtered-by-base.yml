# gate-expect: pr-base-filter
# NEGATIVE fixture: `branches:` under `pull_request` filters the BASE branch, so a
# pull request opened against any other branch never fires this workflow and its
# checks come out ABSENT. This is the shape ci.yml carried until 2026-09-01.
name: bad-pr-base-filter
on:
  pull_request:
    branches:
      - main
      - stable
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gates/run-all.sh
