# Fixture POSITIVO: usa un secreto, pero NO es alcanzable desde un fork.
name: good-schedule
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TOKEN: ${{ secrets.ALGUN_SECRETO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
