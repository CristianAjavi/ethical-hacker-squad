# POSITIVE fixture: guards against the FALSE POSITIVE of the secrets scanner.
# Here the word "secrets" shows up in a `name:`, in a comment and inside a
# string, but there is NO read of the `secrets` context at all. A
# `pull_request` workflow like this one has to come out clean, or the gate
# turns into noise and people learn to ignore it.
name: good-secrets-word
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: look for secrets in the tree
        run: |
          echo "looking for leaked secrets"
          grep -r "secrets" . || true
