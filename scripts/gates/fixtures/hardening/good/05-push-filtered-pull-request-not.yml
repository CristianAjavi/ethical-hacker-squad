# POSITIVE fixture, and the negative control of rule 5. `branches:` under `push`
# is legitimate and is NOT the same filter: it matches the branch that was pushed.
# A rule that read the two the same way would fire on most of this repository, so
# this file exists to prove it distinguishes them by which trigger's body it is in.
name: good-push-filtered-pr-not
on:
  pull_request:
  push:
    branches:
      - main
      - stable
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/gates/run-all.sh
