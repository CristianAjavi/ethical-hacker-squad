# What release.yml and ci.yml do now: the lock file, and no install scripts.
name: tools
on:
  push:
permissions: {}
jobs:
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          # npm install -g would resolve a tag; this comment must not trip the rule
          npm ci --ignore-scripts
