# Fixture POSITIVO: cumple las cuatro reglas duras.
name: good-minimo
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Script sin interpolacion
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITULO" > /dev/null
          echo "uses: actions/checkout@v5 (esto es texto, no una accion)"
