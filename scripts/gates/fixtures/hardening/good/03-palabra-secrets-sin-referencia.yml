# Fixture POSITIVO: guarda contra el FALSO POSITIVO del escaner de secretos.
# Aqui la palabra "secrets" aparece en un `name:`, en un comentario y dentro de
# una cadena, pero NO hay ninguna lectura del contexto `secrets`. Un workflow de
# `pull_request` como este tiene que salir limpio, o el gate se vuelve ruido y
# la gente aprende a ignorarlo.
name: good-palabra-secrets
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  auditar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: buscar secrets en el arbol
        run: |
          echo "buscando secrets filtrados"
          grep -r "secrets" . || true
