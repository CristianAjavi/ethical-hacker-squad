# POSITIVE fixture: the escape hatch works, and it is loud. The marker sits on the
# filtered line itself and carries a reason, so `grep -rn hardening-allow` lists
# every workflow that took it and why.
name: good-pr-base-filter-declared
on:
  pull_request:
    branches: [main]  # hardening-allow: base-filter this job only publishes docs for main
permissions: {}
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo docs
