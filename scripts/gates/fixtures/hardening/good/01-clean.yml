# POSITIVE fixture: satisfies all four hard rules.
name: good-minimal
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Script without interpolation
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > /dev/null
          echo "uses: actions/checkout@v5 (this is text, not an action)"
