# POSITIVE fixture: the workflow that DOES NOT carry setup-python, and says so.
# The explanation has to name the action - that is the point of writing it - so a
# rule matching the bare string would put this file in permanent red and the next
# person would delete the sentence rather than the step. Only a real `uses:`
# counts.
#
# WHERE the name sits matters, and this fixture was wrong once for exactly that:
# the scanner drops whole-line comments and `run: |` bodies BEFORE any rule sees
# them, so a name hidden there holds nothing down - a bare-string mutant survived
# the first version of this file. The name now also travels in a step `name:` and
# in a trailing comment, which are lines the rule actually reads.
name: good-setup-python-only-in-prose
on:
  push:
    branches: [main]
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # THERE IS DELIBERATELY NO actions/setup-python HERE. This job measures
      # what the suite costs in CI, so it has to run on CI's own python3.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite on the runner image python, not actions/setup-python
        run: bash scripts/run-batteries.sh  # no actions/setup-python on purpose
