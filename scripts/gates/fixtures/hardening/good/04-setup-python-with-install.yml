# POSITIVE fixture: setup-python is not forbidden. A job that brings its own
# interpreter and then installs what it needs is measuring a machine it built
# on purpose, which is a decision, not an accident. The install lives inside a
# `run: |` block, which the scanner steps over for every other rule - this one
# has to read it anyway.
name: good-setup-python-with-install
on:
  push:
    branches: [main]
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bring what the suite imports
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
      - name: Run the suite
        run: |
          bash scripts/run-batteries.sh
