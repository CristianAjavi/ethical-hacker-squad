# POSITIVE fixture: uses a secret, but is NOT reachable from a fork.
name: good-schedule
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TOKEN: ${{ secrets.SOME_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
