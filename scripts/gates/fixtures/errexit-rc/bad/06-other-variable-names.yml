# gate-expect: status
# NEGATIVE fixture: the defect is not spelled `rc`. A checker keyed to that one
# name misses `status`, `r1`, `code` and every other spelling.
name: bad-other-names
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Other names
        run: |
          bash scripts/meter/meter.sh > meter.txt 2>&1
          status=$?
          bash scripts/gates/run-all.sh > gates.txt 2>&1
          export code=$?
          echo "$status $code"
