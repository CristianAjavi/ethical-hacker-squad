# gate-expect: r1
# NEGATIVE fixture: the shape that killed the A/B measurement on
# measure/battery-workers. Under `bash -eo pipefail {0}` the redirect runs, the
# script returns non-zero, the step is torn down, and `r1=$?` never executes.
name: bad-trailing-semicolon
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Serial arm
        run: |
          bash scripts/run-batteries.sh --jobs 1 > one.out 2>&1; r1=$?
          echo "rc was $r1"
