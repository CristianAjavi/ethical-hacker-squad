# gate-expect: r2
# NEGATIVE fixture: the capture sits on a backslash continuation, so a check
# that reads physical lines one at a time sees a redirect and no command.
name: bad-continuation
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Parallel arm
        env:
          JOBS: '4'
        run: |
          EHS_TIMING_JOBS="$JOBS" bash scripts/time-repeat.mutants.selftest.sh \
            > many.out 2>&1; r2=$?
          echo "rc was $r2"
