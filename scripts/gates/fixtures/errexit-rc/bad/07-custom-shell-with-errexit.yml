# gate-expect: rc
# NEGATIVE fixture: a custom shell template that still carries `-e`. Declaring a
# shell explicitly does not make the capture safe; only dropping `-e` does.
name: bad-custom-shell-with-e
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Explicit shell, still errexit
        shell: bash -euo pipefail {0}
        run: |
          bash scripts/gates/run-all.sh > gates.out 2>&1; rc=$?
          echo "rc was $rc"
