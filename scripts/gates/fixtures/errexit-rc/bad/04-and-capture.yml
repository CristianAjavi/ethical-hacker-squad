# gate-expect: rc
# NEGATIVE fixture: `cmd && rc=$?`. The list returns the failing command's
# status, errexit fires on the list, and the capture is never reached. It also
# captures 0 on the happy path, so it can never observe a failure at all.
name: bad-and-capture
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: And-capture
        run: |
          bash scripts/gates/run-all.sh && rc=$?
          echo "rc was ${rc:-unset}"
