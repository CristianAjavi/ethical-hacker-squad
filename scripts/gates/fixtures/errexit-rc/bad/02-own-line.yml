# gate-expect: rc
# NEGATIVE fixture: the same defect spelled over two lines. A newline is not a
# suppressor either.
name: bad-own-line
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Run and read
        run: |
          bash scripts/gates/run-all.sh
          rc=$?
          echo "rc was $rc"
