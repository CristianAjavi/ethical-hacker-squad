# gate-expect: rc
# NEGATIVE fixture: errexit was switched off for an earlier stretch and switched
# back ON before this capture. A checker that only greps for `set +e` somewhere
# in the block calls this safe.
name: bad-errexit-restored
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Two stretches
        run: |
          set +e
          bash scripts/gh/next-version.sh > ver.out
          v=$?
          set -e
          bash scripts/gates/run-all.sh > gates.out 2>&1; rc=$?
          echo "$v $rc"
