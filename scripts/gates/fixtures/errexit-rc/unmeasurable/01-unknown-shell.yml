# gate-expect: unmeasurable
# A shell this checker cannot interpret: not a documented keyword and not a
# template with `{0}`. It says so rather than assuming errexit either way.
name: unmeasurable-unknown-shell
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: A real bash block
        run: |
          echo ok
      - name: Unknown shell
        shell: nushell-please
        run: |
          bash scripts/gates/run-all.sh; rc=$?
          echo "$rc"
