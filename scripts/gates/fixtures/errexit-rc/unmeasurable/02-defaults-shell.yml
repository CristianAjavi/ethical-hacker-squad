# gate-expect: unmeasurable
# `defaults.run.shell` sets the shell for a whole job. This checker only reads
# the shell declared ON the step, so it declares the file unmeasurable instead
# of measuring the steps against a shell it did not read.
name: unmeasurable-defaults-shell
on:
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash {0}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Capture
        run: |
          bash scripts/gates/run-all.sh; rc=$?
          echo "$rc"
