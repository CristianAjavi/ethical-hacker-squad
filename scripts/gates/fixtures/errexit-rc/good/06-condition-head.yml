# gate-expect: clean
# POSITIVE fixture: a capture after a condition head. Errexit does not fire on
# the command of an `if`, so this capture is reached. It is useless - it always
# reads 0 - but it is not the defect this gate is about, and calling it one
# would be the gate acusing a file it does not understand.
name: good-condition-head
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Condition head
        run: |
          if bash scripts/gates/run-all.sh > gates.out 2>&1; then
            rc=$?
            echo "clean: $rc"
          fi
