# gate-expect: clean
# POSITIVE fixture: a custom template WITHOUT `-e`. Errexit is off for the whole
# block, so the plain capture is correct and flagging it would accuse a file
# that complies.
name: good-shell-no-errexit
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: No errexit at all
        shell: bash {0}
        run: |
          bash scripts/gates/run-all.sh > gates.out 2>&1; rc=$?
          echo "rc was $rc"
