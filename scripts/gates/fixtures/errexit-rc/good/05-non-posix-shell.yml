# gate-expect: clean
# POSITIVE fixture: a python block. `$?` has no meaning there and errexit does
# not exist; the block is declared out of scope rather than silently analysed.
name: good-python-block
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Python
        shell: python
        run: |
          rc = 0
          print("rc=$?", rc)
      - name: A real bash block so the file is not empty of scope
        run: |
          echo ok
