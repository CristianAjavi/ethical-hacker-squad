# gate-expect: clean
# POSITIVE fixture: `rc=$?` inside a string and inside a comment is prose, not
# an assignment. A checker matching the bare substring reports both and gets
# switched off within a week.
name: good-quoted
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Print, do not capture
        run: |
          rc=0
          bash scripts/gates/run-all.sh || rc=$?
          echo "serial rc=$? parallel rc=$?"
          echo "finished; rc=$? is what the old shape printed"
          printf 'rc=%s\n' "$rc"
          # the old shape was: cmd > out 2>&1; rc=$?
          echo done
