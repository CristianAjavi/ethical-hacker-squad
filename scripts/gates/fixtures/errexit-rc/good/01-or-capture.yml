# gate-expect: clean
# POSITIVE fixture: the sanctioned form. `||` suppresses errexit for that
# command, so the capture is reached whatever the command returned.
# The second step writes it over a backslash continuation: a checker that reads
# physical lines sees `rc=$?` alone on a line, with no `||` in front of it, and
# reports a file that complies. Joining continuations is what stops that, and
# this is the case that measures it.
name: good-or-capture
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Run and read
        run: |
          rc=0
          bash scripts/gates/run-all.sh > gates.out 2>&1 || rc=$?
          echo "rc was $rc"
      - name: The same thing, wrapped over two physical lines
        run: |
          code=0
          bash scripts/meter/meter.sh --no-gates > meter.txt 2> meter.err || \
            code=$?
          echo "rc was $code"
