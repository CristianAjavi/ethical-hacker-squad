# gate-expect: clean
# POSITIVE fixture: the second sanctioned form, and the one release.yml uses to
# read next-version.sh's three-valued exit code.
name: good-set-plus-e
on:
  workflow_dispatch:
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Bracketed stretch
        run: |
          set -euo pipefail
          set +e
          OUT=$(scripts/gh/next-version.sh --current 1.0.0)
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          case "$RC" in 0) : ;; *) exit 1 ;; esac
