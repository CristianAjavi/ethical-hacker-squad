# The mitigation in place at the workflow level: this is release.yml's shape.
name: good-workflow-env
on:
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
env:
  PYTHONSAFEPATH: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: All the gates, over the candidate tree
        working-directory: source
        run: |
          python3 -c 'import yaml; print(yaml.__file__)'
