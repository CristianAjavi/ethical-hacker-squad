name: good-job-env
on:
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONSAFEPATH: '1'
    steps:
      - name: Judge the candidate
        working-directory: source
        run: |
          cd nested
          python3 -c 'print(1)'
