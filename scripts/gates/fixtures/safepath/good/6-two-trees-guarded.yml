# The same shape with the mitigation in scope: this is what release.yml is.
name: good-two-trees-guarded
on:
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
env:
  PYTHONSAFEPATH: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout of the gates (tip of main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Checkout of the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: All the gates, over the candidate tree
        working-directory: source
        run: ./scripts/gates/run-all.sh
