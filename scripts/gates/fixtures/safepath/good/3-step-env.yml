name: good-step-env
on:
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: source
    steps:
      - name: Judge the candidate
        env:
          PYTHONSAFEPATH: '1'
        run: python3 -c 'print(1)'
