# python at the workspace root: the tree on sys.path is the checkout the
# workflow itself made, which is the case this gate deliberately does not judge.
name: good-python-at-the-root
on:
  pull_request:
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Lint
        run: python3 scripts/lint.py
