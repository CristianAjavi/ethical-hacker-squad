# gate-expect: python-safepath
# The key is there and does nothing: CPython acts on a non-empty string only.
name: bad-safepath-empty
on:
  pull_request:
permissions: {}
env:
  PYTHONSAFEPATH: ''
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Judge the candidate
        working-directory: source
        run: python3 -c 'print(1)'
