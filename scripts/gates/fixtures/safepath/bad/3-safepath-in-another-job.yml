# gate-expect: python-safepath
# PYTHONSAFEPATH is declared, but in a different job. Scope is not a mood.
name: bad-safepath-in-another-job
on:
  pull_request:
permissions: {}
jobs:
  unrelated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONSAFEPATH: '1'
    steps:
      - name: Nothing to do here
        run: echo ok
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Judge the candidate
        working-directory: source
        run: python3 -c 'print(1)'
