# gate-expect: python-safepath
# The shape issue #15 describes: main's gates, the candidate tree as cwd, and
# nothing keeping the candidate's own `yaml.py` off sys.path.
name: bad-step-working-directory
on:
  pull_request:
permissions: {}
jobs:
  verify:
    name: Gates over the candidate tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: All the gates, over the candidate tree
        working-directory: source
        run: |
          python3 -c 'import yaml; print(yaml.safe_load(open("plugin.json")))'
