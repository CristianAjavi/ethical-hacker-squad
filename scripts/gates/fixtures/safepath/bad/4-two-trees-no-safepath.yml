# gate-expect: python-safepath
# release.yml's verify job, with the mitigation deleted. Note that the word
# `python` appears nowhere: the gates run-all.sh invokes are what reach it.
name: bad-two-trees-no-safepath
on:
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
jobs:
  verify:
    name: Gates over the candidate tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout of the gates (tip of main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Checkout of the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: All the gates, over the candidate tree
        working-directory: source
        run: |
          set -uo pipefail
          ./scripts/gates/run-all.sh
