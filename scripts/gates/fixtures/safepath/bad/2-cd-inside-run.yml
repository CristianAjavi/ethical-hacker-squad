# gate-expect: python-safepath
# The same defect written by hand: no `working-directory:`, a `cd` instead.
name: bad-cd-inside-run
on:
  pull_request:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Judge the candidate
        run: |
          cd source
          python3 - <<'PY'
          import json
          print(json.load(open("plugin.json")))
          PY
