# gate-expect: python-safepath
# The dodge: no `working-directory:`, a `cd` into the judged tree instead.
# Same defect, and the first version of this gate did not see it.
name: bad-two-trees-cd-dodge
on:
  schedule:
    - cron: '0 3 * * 1'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout of the gates (tip of main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - name: Checkout of the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: All the gates, over the candidate tree
        run: |
          set -uo pipefail
          cd source
          ./scripts/gates/run-all.sh
