# .github/zizmor.yml
#
# Explicit zizmor policy for this repository.
#
# `hash-pin` for "*" is already zizmor's default behavior today, but it is
# declared anyway: a change of default in a future version must not be able to
# silently relax a hard rule of this repo. The policy lives in the file, not in
# anyone's memory.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
