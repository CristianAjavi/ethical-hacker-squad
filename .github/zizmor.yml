# .github/zizmor.yml
#
# Politica explicita de zizmor para este repositorio.
#
# `hash-pin` para "*" ya es el comportamiento por defecto de zizmor hoy, pero se
# declara igualmente: un cambio de default en una version futura no debe poder
# relajar en silencio una regla dura del repo. La politica vive en el fichero,
# no en la memoria de nadie.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
