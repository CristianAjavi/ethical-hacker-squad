# .github/workflows/gates-weekly.yml
#
# The gates and batteries that do not block a pull request. Since 2026-10-15
# only the gates whose failure would reach a user who installs the plugin block
# a pull request (scripts/gates/data/gate-sets.json, `pull_request`); the rest -
# the evaluation bench, the governance files, the documents that describe the
# gates to each other - run here once a week and on demand, and in full over
# every release candidate in release.yml. A red here does not block anyone's
# merge; it is read by the maintainer, and it blocks a promotion to `stable`.
#
# Triggers: only a schedule and a manual dispatch. No pull_request_target,
# issues, issue_comment or workflow_run.
name: Weekly gates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: gates-weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-gates:
    name: weekly-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The gates that do not block a pull request
        run: ./scripts/gates/run-all.sh --set weekly --skip 'gate-actions-lint.sh'

      - name: Every battery
        run: ./scripts/run-batteries.sh
