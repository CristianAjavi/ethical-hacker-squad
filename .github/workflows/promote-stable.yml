# ===========================================================================
# Promocion automatica main -> stable (canal 'stable' del marketplace).
#
# QUE HACE
#   Una vez por semana busca en main el commit mas reciente que ya haya
#   cumplido la cuarentena (>= cooldown_days), comprueba que ese commit exacto
#   paso todos los gates, que no hay ningun issue abierto que lo bloquee, y
#   entonces mueve la rama 'stable' a ese commit por fast-forward y crea el tag
#   semver. Si algo no cuadra, no promueve.
#
# MODELO DE AMENAZA - por que este fichero esta escrito asi
#   Este repo distribuye INSTRUCCIONES que Claude Code ejecuta en la maquina de
#   terceros, y parte del contenido nace de un bot que lee internet. Es decir,
#   el pipeline es un canal de inyeccion indirecta de prompts. Reglas duras:
#
#   1. Disparadores. Solo 'schedule' y 'workflow_dispatch'. NUNCA
#      pull_request_target, ni issues, ni issue_comment, ni
#      workflow_run sobre contenido de terceros. Un disparador que se active
#      con texto que escribe un desconocido y que ademas tenga secretos es
#      exactamente el patron del incidente documentado por Cloud Security
#      Alliance (issue malicioso -> robo del token de publicacion -> artefacto
#      comprometido publicado).
#   2. permissions minimos POR JOB, y 'permissions: {}' arriba para no heredar
#      nada por defecto. El job que EJECUTA codigo del commit candidato
#      (gates) no tiene write y no recibe ningun token en el entorno.
#      Solo el job 'promote' tiene contents:write, y ese no ejecuta nada del
#      arbol candidato: solo hace git push.
#   3. Acciones de terceros fijadas por SHA de 40 caracteres. Un tag es
#      mutable; el mantenedor de la accion (o quien le robe la cuenta) puede
#      reapuntarlo a codigo nuevo. Aqui solo se usa una accion: actions/checkout.
#   4. Nada de secretos propios. Se usa unicamente github.token, y solo en los
#      pasos que llaman a la API.
#
# HECHOS DE PLATAFORMA QUE CONDICIONAN EL DISENO (verificados en la doc)
#   - "if a workflow run pushes code using the repository's GITHUB_TOKEN, a new
#     workflow will not run even when the repository contains a workflow
#     configured to run when push events occur".
#     Consecuencia: el push a 'stable' que hace este workflow NO dispara nada.
#     Es intencionado (no queremos cascadas), pero implica que la verificacion
#     tiene que ocurrir AQUI DENTRO, antes de empujar. Por eso el job 'gates'
#     re-ejecuta los gates en vez de confiar solo en la API.
#   - Un PR abierto con GITHUB_TOKEN deja sus checks en estado
#     'approval-required' esperando un clic humano. Por eso la promocion NO
#     pasa por un PR: empuja la rama directamente.
#   - "A job that is skipped will report its status as 'Success'". Por eso
#     ningun gate se salta con 'if:' aqui dentro: la logica condicional vive
#     DENTRO del script, que decide entre 0/1/2. Los 'if:' de este fichero
#     solo apagan la PROMOCION (fallar hacia el lado seguro = no promover),
#     nunca una comprobacion.
#
# LO QUE ESTE WORKFLOW NO GARANTIZA (dicho en voz alta)
#   - El job 'gates' ejecuta scripts que vienen del propio commit candidato.
#     Eso es inevitable si quieres re-verificar de verdad. Se acota con:
#     cero permisos de escritura, cero secretos, y el gate de allowlist de
#     rutas que impide que un PR automatico modifique scripts/ o .github/.
#   - No se puede restringir por plataforma QUIEN empuja a 'stable': en un repo
#     de cuenta personal el campo 'restrictions' de branch protection es
#     org-only. La garantia real la dan los gates, no la rama.
#
# ROLLBACK -> ver el bloque "ROLLBACK" al final del fichero. Tambien se imprime
# en el resumen de cada ejecucion que promueve, listo para copiar y pegar.
# ===========================================================================

name: promote-stable

on:
  schedule:
    # Lunes 06:17 UTC. Minuto no redondo a proposito: la cola de schedules de
    # GitHub se congestiona en punto y los runs se retrasan o se pierden.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo evaluar y explicar. No mueve stable ni crea tags.'
        type: boolean
        default: true

# Sin permisos heredados. Cada job declara los suyos.
permissions: {}

# Nunca dos promociones a la vez: dos runs concurrentes podrian carreriar sobre
# la misma rama. cancel-in-progress false = se encolan, no se pisan.
concurrency:
  group: promote-stable
  cancel-in-progress: false

env:
  STATE_FILE: scripts/gh/governance.json

jobs:
  # =========================================================================
  # 1) CANDIDATO. Solo lectura. Decide QUE commit (si alguno) es promovible.
  # =========================================================================
  candidate:
    name: Elegir y validar el commit candidato
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: read
    outputs:
      decision:     ${{ steps.decide.outputs.decision }}
      candidate_sha: ${{ steps.decide.outputs.candidate_sha }}
      stable_sha:   ${{ steps.decide.outputs.stable_sha }}
      version:      ${{ steps.decide.outputs.version }}
      tag:          ${{ steps.decide.outputs.tag }}
      reason:       ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout main (sin credenciales persistidas)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Traer todas las ramas y tags
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin

      - name: Comprobar utilidades
        run: |
          set -euo pipefail
          for t in jq git gh; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::falta '$t' en el runner"; exit 2; }
          done
          jq -e . "$STATE_FILE" >/dev/null || { echo "::error::$STATE_FILE no es JSON valido"; exit 2; }

      - name: Decidir
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # --- salidas y veredicto ------------------------------------------
          DECISION="block"; REASON=""; CAND=""; STABLE_SHA=""; VERSION=""; TAG=""
          emit() {
            {
              echo "decision=$DECISION"
              echo "candidate_sha=$CAND"
              echo "stable_sha=$STABLE_SHA"
              echo "version=$VERSION"
              echo "tag=$TAG"
              echo "reason=$REASON"
            } >>"$GITHUB_OUTPUT"
          }
          # skip = no hay nada que promover, es normal, el run queda verde.
          skip()  { DECISION="skip";  REASON="$1"; emit; echo "::notice::SIN PROMOCION: $1"; exit 0; }
          # block = hay algo que promover pero NO cumple. Run rojo a proposito:
          # quiero enterarme, no que pase desapercibido como un skip.
          block() { DECISION="block"; REASON="$1"; emit; echo "::error::BLOQUEADO: $1"; exit 1; }

          # --- configuracion declarativa ------------------------------------
          COOLDOWN=$(jq -r '.promotion.cooldown_days'  "$STATE_FILE")
          STABLE=$(jq -r   '.promotion.stable_branch'  "$STATE_FILE")
          SOURCE=$(jq -r   '.promotion.source_branch'  "$STATE_FILE")
          PREFIX=$(jq -r   '.promotion.tag_prefix'     "$STATE_FILE")
          APP_ID=$(jq -r   '.actions_app_id'           "$STATE_FILE")
          echo "cooldown=${COOLDOWN}d  source=$SOURCE  stable=$STABLE  tag_prefix=$PREFIX  app_id=$APP_ID"

          # --- 1. cuarentena: el commit mas nuevo que ya cumplio los N dias --
          # 'git rev-list --before' filtra por fecha del COMMITTER, que es la
          # que se reescribe en un rebase/squash: exactamente la que queremos,
          # porque mide cuanto lleva ese arbol expuesto en main.
          CAND=$(git rev-list -n 1 --first-parent --before="${COOLDOWN} days ago" "origin/${SOURCE}" || true)
          [ -n "$CAND" ] || skip "ningun commit de ${SOURCE} lleva ya ${COOLDOWN} dias; la cuarentena aun no se cumple para nadie"
          CAND_DATE=$(git show -s --format=%cI "$CAND")
          echo "candidato=$CAND ($CAND_DATE)"

          # --- 2. estado actual de stable -----------------------------------
          if git rev-parse -q --verify "refs/remotes/origin/${STABLE}" >/dev/null; then
            STABLE_SHA=$(git rev-parse "refs/remotes/origin/${STABLE}")
            FIRST=false
          else
            STABLE_SHA=""
            FIRST=true
            echo "::notice::la rama '${STABLE}' no existe todavia: esta seria su creacion inicial"
          fi

          if [ "$FIRST" = false ]; then
            [ "$STABLE_SHA" != "$CAND" ] || skip "stable ya apunta al candidato $CAND; nada nuevo que promover"
            # Fast-forward obligatorio. Si stable no es ancestro del candidato,
            # alguien reescribio o empujo fuera de banda: eso lo mira un humano.
            git merge-base --is-ancestor "$STABLE_SHA" "$CAND" \
              || block "stable ($STABLE_SHA) NO es ancestro del candidato ($CAND): las ramas divergieron. Promover requeriria reescribir stable, y eso no lo hace un bot."
          fi

          # --- 3. version semver del candidato ------------------------------
          PLUGIN=$(git show "${CAND}:.claude-plugin/plugin.json" 2>/dev/null || true)
          [ -n "$PLUGIN" ] || block "el candidato $CAND no tiene .claude-plugin/plugin.json"
          VERSION=$(jq -r '.version // empty' <<<"$PLUGIN")
          case "$VERSION" in
            *[!0-9.]*|'') block "version '$VERSION' no es semver X.Y.Z estricto. En el canal stable no se admiten prereleases: los usuarios de 'stable' esperan versiones cerradas." ;;
          esac
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || block "version '$VERSION' no es semver X.Y.Z estricto"
          TAG="${PREFIX}${VERSION}"
          echo "version=$VERSION tag=$TAG"

          # --- 4. la version tiene que SUBIR ---------------------------------
          # Claude Code resuelve la version como plugin.json.version > entrada
          # del marketplace > SHA. Si plugin.json fija version y no se bumpea,
          # los usuarios NO reciben nada aunque stable se mueva: promover seria
          # una operacion invisible. Mejor decirlo que fingir que publicamos.
          if [ "$FIRST" = false ]; then
            PREV=$(git show "${STABLE_SHA}:.claude-plugin/plugin.json" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -n "$PREV" ]; then
              if [ "$PREV" = "$VERSION" ]; then
                skip "plugin.json sigue en $VERSION (igual que stable): sin bump de version la promocion no llegaria a ningun usuario"
              fi
              LOWEST=$(printf '%s\n%s\n' "$VERSION" "$PREV" | sort -V | head -n1)
              [ "$LOWEST" = "$PREV" ] || block "la version del candidato ($VERSION) es MENOR que la de stable ($PREV): eso degradaria a los usuarios del canal"
            fi
          fi

          # --- 5. el tag no puede ya existir apuntando a otra cosa ------------
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED=$(git rev-list -n 1 "refs/tags/${TAG}")
            if [ "$TAGGED" = "$CAND" ]; then
              echo "::notice::el tag $TAG ya existe y apunta al candidato (idempotente)"
            else
              block "el tag $TAG ya existe y apunta a $TAGGED, no al candidato $CAND. Un tag publicado NUNCA se mueve: sube la version en plugin.json."
            fi
          fi

          # --- 6. issues bloqueantes ----------------------------------------
          # Se filtran los pull requests: /issues los devuelve mezclados y un PR
          # abierto con la label no debe congelar el canal.
          # El bucle lee por el FD 3 y cada 'gh' se lanza con </dev/null: si un
          # comando del cuerpo consumiese stdin se comeria el resto de labels y
          # el canal quedaria "sin issues bloqueantes" sin haberlos consultado.
          BLOCKERS=$(jq -r '.promotion.blocking_issue_labels[]' "$STATE_FILE")
          BLOCKED=""; N_LB=0
          while IFS= read -r lb <&3; do
            [ -n "$lb" ] || continue
            N_LB=$((N_LB+1))
            if ! LIST=$(gh api --paginate "repos/${REPO}/issues?state=open&labels=${lb}&per_page=100" \
                          --jq '.[] | select(.pull_request == null) | "#\(.number) \(.title)"' </dev/null); then
              block "no pude consultar los issues con label '$lb'. No se si el canal esta bloqueado, asi que no promuevo."
            fi
            if [ -n "$LIST" ]; then
              echo "label '$lb':"; echo "$LIST" | sed 's/^/   /'
              BLOCKED="${BLOCKED}${lb} "
            else
              echo "label '$lb': ningun issue abierto"
            fi
          done 3<<<"$BLOCKERS"
          [ -z "$BLOCKED" ] || block "hay issues abiertos con label(s) bloqueante(s): ${BLOCKED}. Cierralos o quitales la label."
          N_LB_WANT=$(jq -r '.promotion.blocking_issue_labels | length' "$STATE_FILE")
          [ "$N_LB" -eq "$N_LB_WANT" ] || block "consulte $N_LB de $N_LB_WANT labels bloqueantes: el bucle se corto y no se si el canal esta bloqueado."

          # --- 7. checks del commit candidato --------------------------------
          # Evidencia por API. Reglas duras:
          #   - cada context requerido debe EXISTIR y estar en success,
          #   - reportado por la app 15368 (github-actions). Sin fijar app, una
          #     integracion con write puede pintar de verde un context con el
          #     mismo nombre sin ejecutar nada,
          #   - 'skipped' y 'neutral' en un context requerido NO valen: un job
          #     saltado reporta exito y ese es justo el rc=0 que significa "no
          #     lo revise",
          #   - cero checks == FALLO, no exito. Ausencia de evidencia no es
          #     evidencia de ausencia de problemas.
          if ! RAW_CHECKS=$(gh api --paginate "repos/${REPO}/commits/${CAND}/check-runs?per_page=100" \
                             --jq '[.check_runs[] | {name, app: .app.id, status, conclusion, started_at}]'); then
            block "no pude leer los check runs de ${CAND}. Sin evidencia no promuevo."
          fi
          # --paginate emite un array por pagina: se fusionan con -s + add.
          CHECKS=$(jq -s 'add // []' <<<"$RAW_CHECKS")
          TOTAL=$(jq 'length' <<<"$CHECKS")
          echo "check runs sobre $CAND: $TOTAL"
          jq -r '.[] | "   \(.name)  app=\(.app)  status=\(.status)  conclusion=\(.conclusion)"' <<<"$CHECKS"
          [ "$TOTAL" -gt 0 ] || block "el candidato $CAND no tiene NINGUN check run. Cero evidencia = no se promueve."

          RUNNING=$(jq '[.[] | select(.status != "completed")] | length' <<<"$CHECKS")
          [ "$RUNNING" -eq 0 ] || block "$RUNNING check run(s) todavia sin completar sobre $CAND"

          BAD=$(jq -r '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required" or .conclusion == "stale") | .name] | join(", ")' <<<"$CHECKS")
          [ -z "$BAD" ] || block "check runs en rojo sobre $CAND: $BAD"

          MISSING=""; N_CTX=0
          REQ_CTX=$(jq -r '.promotion.required_contexts[]' "$STATE_FILE")
          while IFS= read -r ctx <&3; do
            [ -n "$ctx" ] || continue
            N_CTX=$((N_CTX+1))
            CONC=$(jq -r --arg n "$ctx" --argjson a "$APP_ID" \
                    '[.[] | select(.name == $n and .app == $a)] | sort_by(.started_at) | last | .conclusion // "AUSENTE"' <<<"$CHECKS")
            if [ "$CONC" = "success" ]; then
              echo "context requerido '$ctx' = success (app $APP_ID)"
            else
              echo "context requerido '$ctx' = $CONC (app $APP_ID)"
              MISSING="${MISSING}${ctx}:${CONC} "
            fi
          done 3<<<"$REQ_CTX"
          [ -z "$MISSING" ] || block "contexts requeridos no satisfechos sobre $CAND -> ${MISSING}"
          # Contabilidad: si el bucle no recorrio todos los contextos declarados,
          # "ninguno falta" seria una conclusion sacada de una vuelta incompleta.
          N_CTX_WANT=$(jq -r '.promotion.required_contexts | length' "$STATE_FILE")
          [ "$N_CTX" -eq "$N_CTX_WANT" ] || block "verifique $N_CTX de $N_CTX_WANT contexts requeridos: vuelta incompleta, no promuevo."

          # --- veredicto -----------------------------------------------------
          DECISION="promote"
          REASON="candidato $CAND (v$VERSION, ${CAND_DATE}) cumplio ${COOLDOWN}d de cuarentena, $TOTAL checks en verde y ningun issue bloqueante"
          emit
          echo "::notice::PROMOVIBLE: $REASON"

      # Los valores viajan por 'env', NUNCA interpolados con ${{ }} dentro del
      # 'run'. Interpolar datos en el cuerpo de un script es el patron exacto
      # de la inyeccion en Actions: el texto se convierte en codigo antes de
      # que bash lo vea. Por env llegan como datos y no se ejecutan.
      - name: Resumen
        if: always()
        env:
          D_DECISION: ${{ steps.decide.outputs.decision }}
          D_CAND:     ${{ steps.decide.outputs.candidate_sha }}
          D_STABLE:   ${{ steps.decide.outputs.stable_sha }}
          D_VERSION:  ${{ steps.decide.outputs.version }}
          D_TAG:      ${{ steps.decide.outputs.tag }}
          D_REASON:   ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## Candidato a stable"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            printf '| decision | `%s` |\n'      "${D_DECISION:-}"
            printf '| commit | `%s` |\n'        "${D_CAND:-}"
            printf '| stable actual | `%s` |\n' "${D_STABLE:-(no existia)}"
            printf '| version | `%s` |\n'       "${D_VERSION:-}"
            printf '| tag | `%s` |\n'           "${D_TAG:-}"
            printf '| motivo | %s |\n'          "${D_REASON:-}"
          } >>"$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 2) GATES. Re-ejecuta los gates SOBRE EL COMMIT CANDIDATO.
  #    Sin escritura y sin ningun token en el entorno: este job ejecuta codigo
  #    del arbol candidato, asi que se le trata como no confiable.
  #    La evidencia por API del job anterior dice "los gates pasaron cuando se
  #    fusiono". Este job dice "los gates pasan AHORA, sobre este arbol exacto".
  #    Hacen falta las dos: la primera puede ser vieja, la segunda no prueba
  #    que se ejecutara en su momento.
  # =========================================================================
  gates:
    name: Re-ejecutar los gates sobre el candidato
    needs: candidate
    if: needs.candidate.outputs.decision == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del commit candidato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Ejecutar todos los gates
        run: |
          set -uo pipefail
          GATES_DIR=$(jq -r '.promotion.gates_dir' "$STATE_FILE")
          echo "directorio de gates: $GATES_DIR"

          if [ ! -d "$GATES_DIR" ]; then
            echo "::error::$GATES_DIR no existe. No puedo verificar nada, asi que NO se promueve. (rc=2: no pude medir, que no es lo mismo que 'esta bien')"
            exit 2
          fi

          # --- descubrimiento -------------------------------------------------
          # RECURSIVO y sin filtrar por extension. Un descubridor que solo mira
          # '*.sh' a un nivel convierte cualquier gate escrito en Python, node o
          # metido en una subcarpeta en un gate que NO CORRE, y el job seguiria
          # diciendo "todos en verde". Se excluye unicamente lo que declarada-
          # mente no es ejecutable (documentacion y datos). Orden estable.
          LIST="$(mktemp)"; NORUN="$(mktemp)"
          find "$GATES_DIR" -type f \
            ! -name '.*' ! -name '*.md' ! -name '*.txt' \
            ! -name '*.json' ! -name '*.yml' ! -name '*.yaml' \
            | LC_ALL=C sort >"$LIST"
          N=$(grep -c . "$LIST" || true)
          if [ "$N" -eq 0 ]; then
            echo "::error::$GATES_DIR no contiene ningun gate ejecutable. Cero gates = cero verificacion = no se promueve."
            exit 2
          fi
          echo "gates descubiertos: $N"

          # Todo lo descubierto tiene que ser ejecutable de alguna forma. Si hay
          # un fichero que parece un gate y no se como lanzarlo, el veredicto
          # honesto es 2 (no pude medir), nunca 0.
          while IFS= read -r g <&3; do
            [ -n "$g" ] || continue
            case "$g" in
              *.sh) continue ;;
            esac
            [ -x "$g" ] || printf '%s\n' "$g" >>"$NORUN"
          done 3<"$LIST"
          if [ -s "$NORUN" ]; then
            echo "::error::hay ficheros en $GATES_DIR que no se ejecutar (ni *.sh ni bit de ejecucion). No se promueve sin saber que son:"
            sed 's/^/   /' "$NORUN"
            exit 2
          fi

          # --- ejecucion ------------------------------------------------------
          # Dos precauciones que parecen cosmeticas y no lo son:
          #  1. la lista se lee por el FD 3, no por stdin. Con la lista en stdin,
          #     el PRIMER gate que lea de stdin (cat, read, jq sin fichero,
          #     xargs...) se traga el resto de la lista y el bucle termina
          #     antes de tiempo declarando verde lo que jamas ejecuto.
          #  2. cada gate se lanza con </dev/null: un gate no hereda stdin y no
          #     puede quedarse esperando una entrada que en CI no llegara nunca.
          if command -v timeout >/dev/null 2>&1; then TMO="timeout 600"; else TMO=""; fi
          FAILED=""; UNMEASURED=""; PASSED=""; RUN=0
          while IFS= read -r g <&3; do
            [ -n "$g" ] || continue
            echo ""
            echo "──────── $g ────────"
            rc=0
            # Ruta invocable tanto si gates_dir es relativo como absoluto.
            case "$g" in /*) X="$g" ;; *) X="./$g" ;; esac
            case "$g" in
              *.sh) $TMO bash "$X" </dev/null || rc=$? ;;
              *)    $TMO "$X" </dev/null || rc=$? ;;
            esac
            RUN=$((RUN+1))
            case "$rc" in
              0) echo "   rc=0 medido y correcto";        PASSED="$PASSED $g" ;;
              1) echo "   rc=1 medido y FALLA";           FAILED="$FAILED $g" ;;
              2) echo "   rc=2 NO PUDO MEDIR";            UNMEASURED="$UNMEASURED $g" ;;
              *) echo "   rc=$rc codigo no contemplado";  FAILED="$FAILED $g(rc=$rc)" ;;
            esac
          done 3<"$LIST"

          {
            echo "## Gates sobre el candidato"
            echo ""
            echo "- descubiertos: \`$N\`  ejecutados: \`$RUN\`"
            echo "- correctos: \`${PASSED:-ninguno}\`"
            echo "- fallidos: \`${FAILED:-ninguno}\`"
            echo "- sin medir: \`${UNMEASURED:-ninguno}\`"
          } >>"$GITHUB_STEP_SUMMARY"

          # Contabilidad explicita: descubiertos == ejecutados. Es la red que
          # atrapa cualquier forma futura de que el bucle se corte a la mitad.
          if [ "$RUN" -ne "$N" ]; then
            echo "::error::descubri $N gates pero solo ejecute $RUN. El bucle se corto: no se promueve sobre una verificacion incompleta."
            exit 2
          fi

          if [ -n "$FAILED" ]; then
            echo "::error::gates en rojo:$FAILED"
            exit 1
          fi
          if [ -n "$UNMEASURED" ]; then
            # Deliberado: "no pude medir" bloquea la promocion igual que un
            # fallo. Promover sobre una comprobacion que no llego a ejecutarse
            # es publicar a ciegas.
            echo "::error::gates que no pudieron medir:$UNMEASURED . No se promueve sobre una verificacion incompleta."
            exit 1
          fi
          echo "todos los gates en verde ($RUN/$N ejecutados)"

  # =========================================================================
  # 3) PROMOTE. Unico job con contents:write. No ejecuta nada del arbol
  #    candidato: solo git push de un SHA ya verificado.
  # =========================================================================
  promote:
    name: Mover stable y etiquetar
    needs: [candidate, gates]
    if: needs.candidate.outputs.decision == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Empujar stable y crear el tag
        env:
          CAND:       ${{ needs.candidate.outputs.candidate_sha }}
          STABLE_SEEN: ${{ needs.candidate.outputs.stable_sha }}
          TAG:        ${{ needs.candidate.outputs.tag }}
          VERSION:    ${{ needs.candidate.outputs.version }}
          DRY_RUN:    ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          STABLE=$(jq -r '.promotion.stable_branch' "$STATE_FILE")
          git fetch --force --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --force --tags origin

          # --- guardia TOCTOU ------------------------------------------------
          # Entre la verificacion y este push pueden haber pasado minutos. Si
          # stable se movio, lo verificado ya no describe el estado real.
          if git rev-parse -q --verify "refs/remotes/origin/${STABLE}" >/dev/null; then
            NOW=$(git rev-parse "refs/remotes/origin/${STABLE}")
          else
            NOW=""
          fi
          if [ "$NOW" != "$STABLE_SEEN" ]; then
            echo "::error::stable cambio durante la verificacion (visto '$STABLE_SEEN', ahora '$NOW'). Aborto: lo que se verifico ya no es el estado actual."
            exit 1
          fi
          git cat-file -e "${CAND}^{commit}" || { echo "::error::el commit candidato $CAND ya no existe"; exit 1; }

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::DRY RUN. Se habrian ejecutado:"
            echo "   git push origin ${CAND}:refs/heads/${STABLE}"
            echo "   git tag -a ${TAG} ${CAND} && git push origin refs/tags/${TAG}"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Push SIN --force. Si por lo que sea no fuese fast-forward, GitHub lo
          # rechaza y este job falla: es la ultima red de seguridad y no se
          # desactiva nunca.
          echo "moviendo ${STABLE} -> ${CAND}"
          git push origin "${CAND}:refs/heads/${STABLE}"

          # Tag anotado e idempotente. Un tag publicado no se mueve jamas.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::el tag ${TAG} ya existe localmente; no se toca"
          else
            git tag -a "${TAG}" "${CAND}" -m "canal stable ${VERSION} (promovido desde main tras cuarentena y gates en verde)"
          fi
          git push origin "refs/tags/${TAG}"
          echo "::notice::promovido: ${STABLE} -> ${CAND} (${TAG})"

      - name: Resumen y rollback listo para copiar
        if: always()
        env:
          CAND:        ${{ needs.candidate.outputs.candidate_sha }}
          STABLE_SEEN: ${{ needs.candidate.outputs.stable_sha }}
          TAG:         ${{ needs.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          STABLE=$(jq -r '.promotion.stable_branch' "$STATE_FILE")
          {
            echo "## Promocion a \`${STABLE}\`"
            echo ""
            echo "- commit: \`${CAND}\`"
            echo "- tag: \`${TAG}\`"
            echo "- stable anterior: \`${STABLE_SEEN:-(no existia)}\`"
            echo ""
            echo "### Rollback (un comando, lo corre el DUENO del repo)"
            echo ""
            echo '```bash'
            echo "git fetch origin && git push --force-with-lease=${STABLE}:\$(git rev-parse origin/${STABLE}) origin ${STABLE_SEEN:-<sha-bueno-anterior>}:refs/heads/${STABLE}"
            echo '```'
            echo ""
            echo "Por que lo tiene que correr una persona y no este workflow:"
            echo "\`${STABLE}\` tiene \`allow_force_pushes=false\`, y volver atras exige reescribir la rama."
            echo "El \`GITHUB_TOKEN\` de Actions tiene permiso de escritura pero NO es administrador,"
            echo "asi que no puede saltarse esa proteccion. Quien si puede es el dueno, porque"
            echo "\`enforce_admins=false\` en \`scripts/gh/governance.json\` (decision documentada alli:"
            echo "ese es precisamente el hueco que deja el rollback posible). Si algun dia pones"
            echo "\`enforce_admins=true\`, este comando deja de funcionar sin desactivar antes la proteccion."
            echo ""
            echo "Alternativa sin reescribir historia: sube la version en \`.claude-plugin/plugin.json\`"
            echo "revirtiendo el contenido y deja que la siguiente promocion avance hacia delante."
          } >>"$GITHUB_STEP_SUMMARY"

# ===========================================================================
# ROLLBACK
#
#   git fetch origin && \
#   git push --force-with-lease=stable:$(git rev-parse origin/stable) \
#            origin <SHA-BUENO-ANTERIOR>:refs/heads/stable
#
#   --force-with-lease y no --force: si alguien mas movio stable entre tu fetch
#   y tu push, el comando se niega en vez de borrar su trabajo.
#   El SHA bueno anterior sale de:  git log --oneline origin/stable
#   o del tag de la promocion previa:  git rev-list -n1 stable-vX.Y.Z
#
#   Requiere las credenciales del DUENO (admin). El GITHUB_TOKEN de Actions no
#   sirve: tiene write, no admin, y stable esta con allow_force_pushes=false.
#   Esto es a proposito: que un bot pueda reescribir el canal que consumen los
#   usuarios seria una puerta trasera, no una comodidad.
#
#   El tag NO se borra en un rollback. Un tag publicado es un hecho historico;
#   si esa version era mala, se saca una nueva version, no se reescribe la vieja.
#
# CONGELAR EL CANAL SIN TOCAR NADA MAS
#   Abre un issue con la label 'stable-blocker'. La proxima ejecucion lo lee de
#   scripts/gh/governance.json y no promueve mientras siga abierto.
# ===========================================================================
