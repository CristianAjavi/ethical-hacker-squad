# .github/workflows/ci.yml
#
# CI for the repo. Runs EVERY gate in scripts/gates/ and distinguishes the three
# possible outcomes: 0 measured/OK, 1 measured/FAILS, 2 COULD NOT MEASURE.
# A gate at 2 is NOT taken as good: the step ends red just like a 1, but the run
# summary separates them so it is visible that a check never actually happened
# ("reviewed and correct" is not the same as "not reviewed").
#
# Triggers: only events from this repository. No pull_request_target, issues,
# issue_comment or workflow_run: those are the paths by which a third party gets
# text into a privileged context.
#
# Note on `push`: a push made by a workflow using GITHUB_TOKEN does NOT create a
# workflow run (documented by GitHub). That is, if the automatic promotion to
# `stable` pushes with GITHUB_TOKEN, this CI will not trigger on that push; the
# quality gate has to have been closed BEFORE, in the run that promotes.
name: CI

on:
  pull_request:
    branches:
      - main
      - stable
  push:
    branches:
      - main
      - stable

# No default permissions: each job asks for the minimum it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # The job NAME is what becomes the check-run name, and that string is what
    # scripts/gh/governance.json lists in promotion.required_contexts and what
    # branch protection would require. A prose name ("Deterministic gates (no
    # external tools)") makes that contract fragile and unreadable, so the name
    # is kept identical to the job id. apply-governance.sh fails if the two ever
    # drift apart.
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate inventory
        run: ./scripts/gates/run-all.sh --list

      - name: Run the gates that do not depend on external tools
        run: ./scripts/gates/run-all.sh --skip 'gate-actions-lint.sh'

  workflow-hardening:
    # Same rule as above: the name IS the required-context string.
    name: workflow-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No token: this job analyzes the content of the PR, which on a fork is
      # untrusted content. The zizmor audits that need network access live in
      # supply-chain-audit.yml, which is not triggered from forks.
      #
      # actionlint delegates the analysis of `run:` blocks to shellcheck. If the
      # runner does not ship it, the gate says so and returns 2 (COULD NOT
      # MEASURE) and this step stays red ON PURPOSE: "I did not review it"
      # cannot look green.
      - name: zizmor + actionlint over the workflows
        env:
          # Tool cache outside the work tree: the gate installs zizmor and
          # actionlint at pinned versions and verifies the SHA-256 of the
          # downloaded binary. (`runner.*` is only available at step level,
          # not at job level.)
          GATE_TOOLS_DIR: ${{ runner.temp }}/gate-tools
        run: ./scripts/gates/run-all.sh --only 'gate-actions-lint.sh'
