name: Battery workers A/B

# WHY THIS RUNS SOMEWHERE ELSE
#     The question - does running the batteries several at a time make the suite
#     faster - was already asked once, on a laptop, and the laptop could not
#     answer it. Four alternated runs there put the serial arm at 309.5 s and
#     483.6 s over IDENTICAL code: 174.1 s of disagreement with itself, 56% of
#     its own fast run. A range that wide swallows the effect in both directions,
#     so neither "faster" nor "slower" was a reading that machine could support.
#
#     So the instrument moves. This job runs the two arms ALTERNATELY on a
#     runner and reports whether their ranges overlap, which is the only form
#     the answer can take. If they overlap here too, the answer is NO-MEDIDO and
#     it gets written down as that - a second unreadable instrument is a result,
#     not a licence to pick the number that suits.
#
#     Both arms are the SAME FILE at the same commit, differing only in --jobs.
#     Comparing two files would confound the worker count with every other line
#     that changed between them.
#
# It is manual on purpose: it costs tens of minutes of runner time and answers a
# question that is asked once per change to the runner, not once per push.

# The push trigger is not a convenience. A `workflow_dispatch` workflow can only
# be dispatched once its file is on the DEFAULT branch, so a measurement written
# on a feature branch cannot be run until after the change it is supposed to
# justify has already been merged - the measurement would arrive after the
# decision it exists to inform. Pushing the branch under `measure/` runs it where
# it was written. The prefix keeps it off every other branch.
on:
  push:
    branches: ['measure/**']
  workflow_dispatch:
    inputs:
      runs:
        description: "timed runs per arm"
        required: false
        default: "3"
      jobs:
        description: "workers in the parallel arm"
        required: false
        default: "4"

# Granted job by job, never inherited: a workflow that says nothing here takes
# whatever the repository default happens to be on the day it runs.
permissions: {}

jobs:
  ab:
    name: serial vs parallel, alternated
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: How many batteries, and how many cores
        run: |
          echo "cores: $(nproc)"
          echo "batteries: $(bash scripts/run-batteries.sh --list | wc -l)"

      # The timer captures the command's output, so when an arm comes back red
      # the log says "exited 2" and not one word about which battery. That is
      # what happened the first time this job ran, and the diagnosis had to be
      # fetched from a different workflow's log. One plain run first, with its
      # output where a reader can see it: a red suite is a fact about the suite,
      # not about the clock, and it should be legible before anything is timed.
      - name: One plain run, so a red suite says which battery
        run: bash scripts/run-batteries.sh

      # The verdict is the overlap, not the medians. --runs is deliberately
      # small: each run is the whole suite, and a fourth repetition buys less
      # than it costs. If the ranges touch, that IS the finding.
      # The inputs go through `env`, never into the run block itself. A
      # workflow_dispatch input is text a caller chose, and `${{ }}` inside a
      # `run:` is expanded by the runner BEFORE the shell sees the line, so the
      # text would be code. Through `env` it is a value the shell reads.
      - name: Alternate the two arms
        env:
          RUNS: ${{ inputs.runs || '3' }}
          JOBS: ${{ inputs.jobs || '4' }}
        run: |
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number"; exit 2 ;; esac
          case "$JOBS" in ''|*[!0-9]*) echo "jobs must be a number"; exit 2 ;; esac
          python3 scripts/time-repeat.py \
            --runs "$RUNS" \
            --label "serial (--jobs 1)" \
            --against-label "parallel (--jobs $JOBS)" \
            --against "bash scripts/run-batteries.sh --jobs $JOBS" \
            -- bash scripts/run-batteries.sh --jobs 1

      # A speed reading is worthless if the two arms did not measure the same
      # thing. Same battery count, same verdict, same transcript but for the one
      # line that declares the worker count.
      - name: The two arms must agree on the verdict, not only on the clock
        env:
          JOBS: ${{ inputs.jobs || '4' }}
        run: |
          case "$JOBS" in ''|*[!0-9]*) echo "jobs must be a number"; exit 2 ;; esac
          bash scripts/run-batteries.sh --jobs 1 > one.out 2>&1; r1=$?
          bash scripts/run-batteries.sh --jobs "$JOBS" > many.out 2>&1; r2=$?
          echo "serial rc=$r1   parallel rc=$r2"
          [ "$r1" = "$r2" ] || { echo "::error title=DIFFERENT VERDICT::the arms disagree on the exit code"; exit 1; }
          if diff <(grep -v 'at a time' one.out) <(grep -v 'at a time' many.out); then
            echo "the transcripts are identical but for the worker count"
          else
            echo "::error title=DIFFERENT TRANSCRIPT::the arms did not measure the same thing"
            exit 1
          fi
