name: gates

# Deterministic checks only. No language model participates in this workflow,
# and nothing here runs on `pull_request_target`: a fork's pull request is
# untrusted input, and the documented compromise chain starts with running it
# with write permissions and repository secrets in scope.

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: G1-G4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Record the interpreter
        run: python3 --version

      - name: Run the gates
        run: python3 scripts/gates/run_all.py

      - name: Prove the gates in the negative
        run: python3 tests/gate_mutants.py
