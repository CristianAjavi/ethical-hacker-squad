# Deterministic triage: the TEMPLATE CHOICE is the form field.
# Issue forms do NOT support conditional labels (`labels:` is template level
# and applies the same way to every issue created with it), so one template per
# category is the only way to derive labels from user input WITHOUT a workflow
# with an `issues:` trigger that processes text written by strangers.
# See .github/TRIAGE.md for the option that was evaluated and REJECTED (parsing dropdowns in a workflow).
#
# blank_issues_enabled: false removes the blank issue, which is the only path
# into the repo with no label at all.
blank_issues_enabled: false
contact_links:
  - name: Report a vulnerability in this plugin (private channel)
    url: https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new
    about: Do NOT open a public issue. Use the private security advisory. Read .github/SECURITY.md first.
  - name: Vulnerability in a third-party project
    url: https://www.cisa.gov/coordinated-vulnerability-disclosure-process
    about: This repo is not a reporting channel for other people's software. Disclose it coordinately with the affected vendor.
  - name: Questions about using the skill
    url: https://github.com/CristianAjavi/ethical-hacker-squad#readme
    about: Read the README and skills/ethical-hacker-squad/SKILL.md before opening an issue.
