# Triaje determinista: la ELECCION DE PLANTILLA es el campo del formulario.
# Los issue forms NO soportan labels condicionales (`labels:` es de nivel plantilla
# y se aplica igual a todas las issues creadas con ella), asi que una plantilla por
# categoria es la unica forma de derivar labels de la entrada del usuario SIN un
# workflow con trigger `issues:` que procese texto de desconocidos.
# Ver .github/TRIAJE.md para la opcion evaluada y RECHAZADA (parseo de dropdowns por workflow).
#
# blank_issues_enabled: false elimina la issue en blanco, que es la unica via
# para entrar al repo sin ningun label.
blank_issues_enabled: false
contact_links:
  - name: Reportar una vulnerabilidad de este plugin (canal privado)
    url: https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new
    about: NO abras un issue publico. Usa el aviso de seguridad privado. Lee .github/SECURITY.md antes.
  - name: Vulnerabilidad en un proyecto de un tercero
    url: https://www.cisa.gov/coordinated-vulnerability-disclosure-process
    about: Este repo no es un canal de reporte para software ajeno. Divulga de forma coordinada con el proveedor afectado.
  - name: Dudas de uso de la skill
    url: https://github.com/CristianAjavi/ethical-hacker-squad#readme
    about: Lee el README y skills/ethical-hacker-squad/SKILL.md antes de abrir un issue.
