name: "Falso negativo (al escuadron se le paso un hallazgo real)"
description: "Habia una vulnerabilidad real en el alcance auditado y el informe no la menciono."
labels:
  - "tipo/falso-negativo"
  - "origen/humano"
  - "estado/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        **Este es el error mas caro de esta herramienta**: el usuario se va convencido de que
        no habia nada. Se trata como defecto de cobertura, no como sugerencia.

        > **Si el fallo esta en ESTE repositorio y no en un proyecto auditado, NO abras este issue.**
        > Usa el [aviso de seguridad privado](https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new).
        > Lee `.github/SECURITY.md`.

        **No pegues exploits armados ni datos reales.** Evidencia minima y redactada:
        lo que hace falta es que se pueda reconstruir el patron, no que se pueda atacar a alguien.
  - type: checkboxes
    id: autorizacion
    attributes:
      label: Alcance etico
      description: "Sin esto el issue se cierra sin analisis."
      options:
        - label: "El sistema auditado es mio o tenia autorizacion explicita para probarlo."
          required: true
        - label: "Lo que pego es el patron minimo redactado, no un exploit funcional contra un sistema de terceros ni datos personales."
          required: true
        - label: "Si la vulnerabilidad afecta a un producto de terceros aun sin parche, la estoy divulgando por su canal, no aqui."
          required: true
  - type: dropdown
    id: rol
    attributes:
      label: Rol que deberia haberlo detectado
      description: "Coincide con el label `area/<rol>`. Si crees que el fallo fue no lanzar ese rol, elige `security-lead`."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: hallazgo-real
    attributes:
      label: El hallazgo que se paso
      description: "Que es, donde estaba (ruta y linea o componente), y cual es el impacto concreto."
      placeholder: |
        Deserializacion insegura en src/jobs/consumer.py:41: el worker hace pickle.loads() sobre
        el cuerpo del mensaje de la cola, y la cola acepta publicaciones de un servicio con menos privilegios.
        Impacto: ejecucion remota de codigo en el worker con las credenciales de la base de datos.
    validations:
      required: true
  - type: textarea
    id: por-que-si-es-real
    attributes:
      label: Por que SI es explotable, con evidencia minima reproducible
      description: |
        Traza atacante -> entrada -> transformacion -> sink, y di que control NO existe.
        Prueba local segura, log redactado o razonamiento verificable. Sin payload armado.
      placeholder: |
        1. El productor de la cola es el servicio X, expuesto en internet y sin autenticacion mutua.
        2. El consumidor no valida tipo ni firma: pickle.loads(body) directo.
        3. Prueba local (entorno propio, dato sintetico): un objeto con __reduce__ que solo escribe
           un fichero temporal se ejecuta al consumir. No adjunto el payload.
    validations:
      required: true
  - type: textarea
    id: stack-artefacto
    attributes:
      label: Stack y artefacto auditado
      description: "Que le diste al escuadron (repo, APK, URL autorizada, IaC, contenedor...), lenguaje/framework y versiones, y el modo usado (auditar / reforzar / verificar)."
      render: text
      placeholder: |
        Artefacto: repo Python (Poetry), modo `auditar`
        Runtime: Python 3.12, Celery 5.4, RabbitMQ 3.13
        Alcance dado: la carpeta completa del repo
    validations:
      required: true
  - type: input
    id: estandar
    attributes:
      label: ID de estandar aplicable
      description: "Formato: CWE-502, OWASP ASVS 1.5.2, MASVS-CODE-4, OWASP LLM01. Si no aplica ninguno, escribe `ninguno`."
      placeholder: "CWE-502"
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad real del hallazgo
      description: "Coincide con el label `severidad/<valor>`."
      options:
        - critica
        - alta
        - media
        - baja
        - informativa
    validations:
      required: true
  - type: textarea
    id: por-que-no-se-vio
    attributes:
      label: Que le falta al escuadron para verlo
      description: |
        Diagnostico de cobertura, no del hallazgo: la orden del rol no menciona ese sink,
        `references/coverage.md` no cubre esa tecnologia, el lider no lanzo ese rol,
        el limite de confianza no estaba descrito, o el patron solo aparece con esa version.
      placeholder: |
        references/coverage.md, seccion 'Web, backend y API', no nombra colas de mensajes como
        superficie de entrada, asi que el rol web-api solo miro rutas HTTP.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version del plugin
      description: "El valor de `version` en .claude-plugin/plugin.json cuando corriste la auditoria."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: canal
    attributes:
      label: Canal de distribucion
      options:
        - latest
        - stable
        - "instalado a mano / no lo se"
    validations:
      required: true
  - type: textarea
    id: regresion
    attributes:
      label: Que deberia vigilarlo (opcional pero acelera el cierre)
      description: "Propon el caso de regresion: artefacto minimo de entrada y el hallazgo que el escuadron DEBE emitir sobre el."
      placeholder: |
        Caso: worker que hace pickle.loads sobre mensaje de cola -> el rol web-api DEBE emitir CWE-502 con severidad alta.
