name: "False negative (the squad missed a real finding)"
description: "There was a real vulnerability inside the audited scope and the report never mentioned it."
labels:
  - "type/false-negative"
  - "origin/human"
  - "status/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        **This is the most expensive error of this tool**: the user walks away convinced
        there was nothing there. It is treated as a coverage defect, not as a suggestion.

        > **If the failure is in THIS repository and not in an audited project, do NOT open this issue.**
        > Use the [private security advisory](https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new).
        > Read `.github/SECURITY.md`.

        **Do not paste weaponized exploits or real data.** Minimal, redacted evidence:
        what is needed is that the pattern can be reconstructed, not that someone can be attacked.
  - type: checkboxes
    id: authorization
    attributes:
      label: Ethical scope
      description: "Without this the issue is closed without analysis."
      options:
        - label: "The audited system is mine or I had explicit authorization to test it."
          required: true
        - label: "What I am pasting is the minimal redacted pattern, not a working exploit against a third-party system, and it contains no personal data."
          required: true
        - label: "If the vulnerability affects an unpatched third-party product, I am disclosing it through their channel, not here."
          required: true
  - type: dropdown
    id: role
    attributes:
      label: Role that should have caught it
      description: "Matches the `area/<role>` label. If you think the failure was not launching that role, pick `security-lead`."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: missed-finding
    attributes:
      label: The finding that was missed
      description: "What it is, where it was (path and line, or component), and what the concrete impact is."
      placeholder: |
        Unsafe deserialization in src/jobs/consumer.py:41: the worker calls pickle.loads() on
        the body of the queue message, and the queue accepts publications from a lower-privileged service.
        Impact: remote code execution in the worker with the database credentials.
    validations:
      required: true
  - type: textarea
    id: why-real
    attributes:
      label: Why it IS exploitable, with minimal reproducible evidence
      description: |
        Trace attacker -> input -> transformation -> sink, and state which control does NOT exist.
        A safe local test, a redacted log, or verifiable reasoning. No weaponized payload.
      placeholder: |
        1. The queue producer is service X, exposed on the internet and without mutual authentication.
        2. The consumer validates neither type nor signature: pickle.loads(body) directly.
        3. Local test (my own environment, synthetic data): an object with __reduce__ that only writes
           a temporary file runs on consumption. I am not attaching the payload.
    validations:
      required: true
  - type: textarea
    id: stack-artifact
    attributes:
      label: Stack and audited artifact
      description: "What you handed to the squad (repo, APK, authorized URL, IaC, container...), language/framework and versions, and the mode used (audit / harden / verify)."
      render: text
      placeholder: |
        Artifact: Python repo (Poetry), mode `audit`
        Runtime: Python 3.12, Celery 5.4, RabbitMQ 3.13
        Scope given: the whole repo folder
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Applicable standard ID
      description: "Format: CWE-502, OWASP ASVS 1.5.2, MASVS-CODE-4, OWASP LLM01. If none applies, write `none`."
      placeholder: "CWE-502"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Real severity of the finding
      description: "Matches the `severity/<value>` label."
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true
  - type: textarea
    id: why-it-was-missed
    attributes:
      label: What the squad is missing in order to see it
      description: |
        A coverage diagnosis, not a diagnosis of the finding: the role instructions never mention
        that sink, `references/coverage.md` does not cover that technology, the lead did not launch
        that role, the trust boundary was not described, or the pattern only shows up on that version.
      placeholder: |
        references/coverage.md, section 'Web, backend and API', does not name message queues as an
        input surface, so the web-api role only looked at HTTP routes.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "The value of `version` in .claude-plugin/plugin.json when you ran the audit."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Distribution channel
      options:
        - latest
        - stable
        - "installed by hand / not sure"
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: What should watch for it (optional, but it speeds up closing)
      description: "Propose the regression case: the minimal input artifact and the finding the squad MUST emit about it."
      placeholder: |
        Case: worker calling pickle.loads on a queue message -> the web-api role MUST emit CWE-502 with high severity.
