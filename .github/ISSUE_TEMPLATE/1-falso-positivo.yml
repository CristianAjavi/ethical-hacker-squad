name: "Falso positivo (el escuadron reporto algo que no es explotable)"
description: "El informe marco un hallazgo que, verificado, no es real o no es alcanzable en ese contexto."
labels:
  - "tipo/falso-positivo"
  - "origen/humano"
  - "estado/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        **Este es uno de los dos errores de primera clase de esta herramienta.** Un falso positivo
        quema tiempo del auditor y erosiona la confianza en todo el informe.

        Un issue de este tipo **se cierra con arreglo + el check que impide que reaparezca**
        (`scripts/gates/gate-issue-closure.sh` bloquea un PR que diga cerrarlo sin tocar
        un gate ni el corpus de casos). Cuanto mas reproducible sea lo que pegues aqui,
        antes se convierte en un caso de regresion.

        **Redacta secretos y datos personales.** Sustituyelos por `<REDACTADO>`.
  - type: checkboxes
    id: autorizacion
    attributes:
      label: Alcance etico
      description: "Sin esto el issue se cierra sin analisis."
      options:
        - label: "La auditoria que produjo este hallazgo fue sobre codigo/sistemas que controlo o que tenia autorizacion explicita para probar."
          required: true
        - label: "No incluyo secretos reales, credenciales, datos personales ni informacion de terceros no autorizados."
          required: true
  - type: dropdown
    id: rol
    attributes:
      label: Rol del escuadron que emitio el hallazgo
      description: "Tal cual aparece en el informe. El valor coincide con el label `area/<rol>`; si no lo sabes, elige `security-lead`."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: hallazgo
    attributes:
      label: Hallazgo tal como lo reporto el escuadron
      description: "Pega el bloque del informe literal (titulo, severidad, ubicacion, evidencia), con los secretos redactados."
      render: text
      placeholder: |
        [ALTA] Inyeccion SQL en src/api/users.ts:88
        Evidencia: la consulta concatena req.query.id
        Recomendacion: usar consulta parametrizada
    validations:
      required: true
  - type: textarea
    id: por-que-no-es-real
    attributes:
      label: Por que NO es explotable
      description: |
        Lo determinante. Elige la razon y demuestrala: control compensatorio que ya existe,
        ruta inalcanzable (dead code, flag apagado), el dato no lo controla el atacante,
        el sink no es peligroso en ese motor/version, o el limite de confianza esta antes.
      placeholder: |
        req.query.id nunca llega a la consulta: el middleware validateId (src/mw/validate.ts:20)
        rechaza con 400 cualquier valor que no sea /^[0-9]+$/, y esta montado para toda la ruta /api/users*.
        Ademas el driver usa consultas preparadas por defecto desde la v9.
    validations:
      required: true
  - type: textarea
    id: stack-artefacto
    attributes:
      label: Stack y artefacto minimo para reproducirlo
      description: "Lenguaje, framework y version, tipo de artefacto auditado, y el fragmento minimo (redactado) que dispara el falso positivo."
      render: text
      placeholder: |
        Artefacto: repo Node/TypeScript (monorepo pnpm)
        Runtime: Node 20.11, Express 4.19, pg 8.11
        Archivo: src/api/users.ts (fragmento redactado abajo)
        ...
    validations:
      required: true
  - type: input
    id: estandar
    attributes:
      label: ID de estandar aplicable
      description: "El identificador que el escuadron invoco o que corresponderia. Formato: CWE-89, OWASP ASVS 5.3.4, MASVS-STORAGE-1, CAPEC-66. Si no aplica ninguno, escribe `ninguno`."
      placeholder: "CWE-89"
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad con la que se reporto
      description: "Coincide con el label `severidad/<valor>`."
      options:
        - critica
        - alta
        - media
        - baja
        - informativa
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version del plugin
      description: "El valor de `version` en .claude-plugin/plugin.json cuando corriste la auditoria."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: canal
    attributes:
      label: Canal de distribucion
      options:
        - latest
        - stable
        - "instalado a mano / no lo se"
    validations:
      required: true
  - type: textarea
    id: regresion
    attributes:
      label: Que deberia vigilarlo (opcional pero acelera el cierre)
      description: "Propon el caso de regresion: entrada, salida esperada del escuadron, y donde viviria (gate o corpus de casos)."
      placeholder: |
        Caso: fichero con parametro validado por middleware previo -> el rol web-api NO debe emitir CWE-89.
