name: "Bug (el plugin no funciona como dice)"
description: "Fallo mecanico: instalacion, marketplace, la skill no se activa, el flujo se rompe, la salida no respeta el formato."
labels:
  - "tipo/bug"
  - "origen/humano"
  - "estado/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Para problemas de **calidad del analisis** usa las plantillas de falso positivo o
        falso negativo. Esta es para cuando la herramienta directamente no hace lo que dice.

        > **Si el bug tiene consecuencia de seguridad para quien instala el plugin**
        > (ejecuta algo que no deberia, filtra contexto, escala permisos), NO lo abras aqui:
        > [aviso de seguridad privado](https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new).
  - type: checkboxes
    id: alcance
    attributes:
      label: Antes de enviar
      options:
        - label: "No incluyo secretos, tokens, rutas con datos personales ni contenido de sistemas de terceros en los logs que pego."
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Que parte falla
      description: "Coincide con el label `area/<valor>`."
      options:
        - "plugin (instalacion, marketplace, versionado)"
        - "security-lead (orquestacion, seleccion de roles, informe final)"
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
        - "ci (workflows, gates, scripts del repo)"
    validations:
      required: true
  - type: textarea
    id: reproduccion
    attributes:
      label: Pasos para reproducir
      description: "Numerados, desde una instalacion limpia si es posible. Incluye la peticion literal que le hiciste a Claude."
      placeholder: |
        1. /plugin marketplace add CristianAjavi/ethical-hacker-squad
        2. /plugin install ethical-hacker-squad
        3. En un repo Node vacio: "audita este repo con el escuadron"
        4. La skill no se activa; responde sin invocar ningun subagente.
    validations:
      required: true
  - type: textarea
    id: esperado-vs-real
    attributes:
      label: Comportamiento esperado vs. real
      placeholder: |
        Esperado: declara alcance y modo `auditar`, lanza entre 2 y 4 especialistas y devuelve el informe de references/report.md.
        Real: contesta en prosa, sin matriz de inventario y sin ningun subagente.
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: "Salida de `claude --version`, sistema operativo, y la version del plugin (`version` en .claude-plugin/plugin.json)."
      render: text
      placeholder: |
        claude --version: 2.0.0
        SO: macOS 15.4 (arm64)
        plugin: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: canal
    attributes:
      label: Canal de distribucion
      options:
        - latest
        - stable
        - "instalado a mano / no lo se"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Salida o error relevante (redactado)
      description: "Pega solo lo minimo. Sustituye rutas y secretos por <REDACTADO>."
      render: text
