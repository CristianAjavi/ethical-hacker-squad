name: "Bug (the plugin does not work as advertised)"
description: "Mechanical failure: installation, marketplace, the skill does not activate, the flow breaks, the output does not follow the format."
labels:
  - "type/bug"
  - "origin/human"
  - "status/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        For **analysis quality** problems use the false positive or false negative
        templates. This one is for when the tool plainly does not do what it says.

        > **If the bug has a security consequence for whoever installs the plugin**
        > (it runs something it should not, leaks context, escalates permissions), do NOT open it here:
        > [private security advisory](https://github.com/CristianAjavi/ethical-hacker-squad/security/advisories/new).
  - type: checkboxes
    id: scope
    attributes:
      label: Before submitting
      options:
        - label: "I am not including secrets, tokens, paths with personal data or third-party system content in the logs I paste."
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part fails
      description: "Matches the `area/<value>` label."
      options:
        - "plugin (installation, marketplace, versioning)"
        - "security-lead (orchestration, role selection, final report)"
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
        - "ci (workflows, gates, repo scripts)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Numbered, from a clean install if possible. Include the literal request you made to Claude."
      placeholder: |
        1. /plugin marketplace add CristianAjavi/ethical-hacker-squad
        2. /plugin install ethical-hacker-squad
        3. In an empty Node repo: "audit this repo with the squad"
        4. The skill does not activate; it answers without invoking any subagent.
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs. actual behavior
      placeholder: |
        Expected: it declares scope and `audit` mode, launches between 2 and 4 specialists and returns the report from references/report.md.
        Actual: it answers in prose, with no inventory matrix and no subagent at all.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Output of `claude --version`, operating system, and the plugin version (`version` in .claude-plugin/plugin.json)."
      render: text
      placeholder: |
        claude --version: 2.0.0
        OS: macOS 15.4 (arm64)
        plugin: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Distribution channel
      options:
        - latest
        - stable
        - "installed by hand / not sure"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error (redacted)
      description: "Paste only the minimum. Replace paths and secrets with <REDACTED>."
      render: text
