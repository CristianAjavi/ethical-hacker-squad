name: "Knowledge gap (missing coverage, technique or standard)"
description: "The squad does not know something it should: a technology, an attack pattern, a standard or a new technique."
labels:
  - "type/knowledge-gap"
  - "origin/human"
  - "status/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        This feeds the knowledge corpus of the skill. Everything that lands here ends up
        shaping what the squad tells **every** user of the plugin, so a **primary public
        source** is required and it must be verifiable: no source, no entry.

        This is not the place to report a concrete vulnerability of a system
        (that is a *false negative*, or the private channel if it affects this repo).
        What is requested here is the missing **capability**.
  - type: checkboxes
    id: scope
    attributes:
      label: Ethical scope
      options:
        - label: "The source I am providing is public and is neither weaponized exploitation material nor an unpatched 0-day."
          required: true
        - label: "What I am proposing serves to audit and defend systems that are mine or authorized, not to attack third parties."
          required: true
  - type: dropdown
    id: role
    attributes:
      label: Role that lacks this knowledge
      description: "Matches the `area/<role>` label."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What the squad should know and does not know today
      description: "An operational statement: the technology, the sink, the configuration pattern or the technique, and why it matters."
      placeholder: |
        It does not cover the policy files of an MCP agent gateway: today it does not check which
        tools are exposed without confirmation, which is the direct path to command execution
        from an untrusted input.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary public source (URL)
      description: "A specification, vendor advisory, CVE/NVD entry, official documentation, paper or MITRE entry. Social media threads and third-party summaries do not count."
      placeholder: "https://cwe.mitre.org/data/definitions/1427.html"
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Applicable standard ID
      description: "Format: CWE-1427, OWASP LLM01, OWASP ASVS 14.2.1, MASVS-PLATFORM-2, CIS Docker 5.7. If none applies, write `none`."
      placeholder: "CWE-1427"
    validations:
      required: true
  - type: textarea
    id: how-to-verify
    attributes:
      label: How to check that the squad has learned it
      description: |
        Without this the gap cannot be closed: describe the minimal input artifact and the exact
        finding the squad must emit about it (and, if it applies, the variant it must NOT emit on,
        so a false negative is not traded for a false positive).
      placeholder: |
        Input: an .mcp.json with a server that declares autoApprove on a shell tool.
        Must emit: a high severity finding citing CWE-1427, located in that file.
        Must not emit: anything if autoApprove is absent or empty.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Typical impact of what goes undetected today
      description: "Matches the `severity/<value>` label."
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version reviewed
      description: "The value of `version` in .claude-plugin/plugin.json."
      placeholder: "1.0.0"
    validations:
      required: true
