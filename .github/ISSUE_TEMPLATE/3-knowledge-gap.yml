name: "Hueco de conocimiento (falta cobertura, tecnica o estandar)"
description: "El escuadron no sabe algo que deberia saber: una tecnologia, un patron de ataque, un estandar o una tecnica nueva."
labels:
  - "tipo/knowledge-gap"
  - "origen/humano"
  - "estado/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Esto alimenta el corpus de conocimiento de la skill. Todo lo que entre aqui
        acaba influyendo en lo que el escuadron le dice a **todos** los usuarios del plugin,
        asi que se exige **fuente publica primaria** y verificable: sin fuente no entra.

        No es el sitio para reportar una vulnerabilidad concreta de un sistema
        (eso es *falso negativo*, o el canal privado si afecta a este repo).
        Aqui se pide la **capacidad** que falta.
  - type: checkboxes
    id: alcance
    attributes:
      label: Alcance etico
      options:
        - label: "La fuente que aporto es publica y no es material de explotacion armado ni un 0-day sin parche."
          required: true
        - label: "Lo que propongo sirve para auditar y defender sistemas propios o autorizados, no para atacar a terceros."
          required: true
  - type: dropdown
    id: rol
    attributes:
      label: Rol al que le falta ese conocimiento
      description: "Coincide con el label `area/<rol>`."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: hueco
    attributes:
      label: Que deberia saber el escuadron y hoy no sabe
      description: "Enunciado operativo: la tecnologia, el sink, el patron de configuracion o la tecnica, y por que importa."
      placeholder: |
        No cubre los ficheros de politica de un gateway de agentes MCP: hoy no revisa que
        herramientas quedan expuestas sin confirmacion, que es la via directa a ejecucion de
        comandos desde una entrada no confiable.
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Fuente publica primaria (URL)
      description: "Especificacion, aviso del fabricante, CVE/NVD, documentacion oficial, paper o entrada de MITRE. No valen hilos de redes sociales ni resumenes de terceros."
      placeholder: "https://cwe.mitre.org/data/definitions/1427.html"
    validations:
      required: true
  - type: input
    id: estandar
    attributes:
      label: ID de estandar aplicable
      description: "Formato: CWE-1427, OWASP LLM01, OWASP ASVS 14.2.1, MASVS-PLATFORM-2, CIS Docker 5.7. Si no aplica ninguno, escribe `ninguno`."
      placeholder: "CWE-1427"
    validations:
      required: true
  - type: textarea
    id: como-se-verifica
    attributes:
      label: Como se comprueba que el escuadron ya lo aprendio
      description: |
        Sin esto el hueco no se puede cerrar: describe el artefacto de entrada minimo y el
        hallazgo exacto que el escuadron debe emitir sobre el (y, si aplica, sobre que
        variante NO debe emitirlo, para no cambiar un falso negativo por un falso positivo).
      placeholder: |
        Entrada: un .mcp.json con un servidor que declara autoApprove sobre una herramienta de shell.
        Debe emitir: hallazgo de severidad alta citando CWE-1427, ubicado en ese fichero.
        No debe emitir: nada si autoApprove esta ausente o vacio.
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Impacto tipico de lo que hoy no se detecta
      description: "Coincide con el label `severidad/<valor>`."
      options:
        - critica
        - alta
        - media
        - baja
        - informativa
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version del plugin revisada
      description: "El valor de `version` en .claude-plugin/plugin.json."
      placeholder: "1.0.0"
    validations:
      required: true
