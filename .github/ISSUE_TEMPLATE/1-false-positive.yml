name: "False positive (the squad reported something that is not exploitable)"
description: "The report flagged a finding that, once verified, is not real or is not reachable in that context."
labels:
  - "type/false-positive"
  - "origin/human"
  - "status/needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        **This is one of the two first-class errors of this tool.** A false positive
        burns auditor time and erodes trust in the whole report.

        An issue of this kind **is closed with a fix plus the check that keeps it from
        coming back** (`scripts/gates/gate-issue-closure.sh` blocks a PR that claims to
        close it without touching a gate or the case corpus). The more reproducible what
        you paste here is, the sooner it becomes a regression case.

        **Redact secrets and personal data.** Replace them with `<REDACTED>`.
  - type: checkboxes
    id: authorization
    attributes:
      label: Ethical scope
      description: "Without this the issue is closed without analysis."
      options:
        - label: "The audit that produced this finding ran against code or systems I control, or that I had explicit authorization to test."
          required: true
        - label: "I am not including real secrets, credentials, personal data or information from unauthorized third parties."
          required: true
  - type: dropdown
    id: role
    attributes:
      label: Squad role that issued the finding
      description: "Exactly as it appears in the report. The value matches the `area/<role>` label; if you do not know it, pick `security-lead`."
      options:
        - security-lead
        - web-api
        - mobile
        - infra-cloud
        - supply-chain
        - ai-safety
        - privacy-abuse
        - remediator
        - verifier
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding as the squad reported it
      description: "Paste the literal block from the report (title, severity, location, evidence), with secrets redacted."
      render: text
      placeholder: |
        [HIGH] SQL injection in src/api/users.ts:88
        Evidence: the query concatenates req.query.id
        Recommendation: use a parameterized query
    validations:
      required: true
  - type: textarea
    id: why-not-real
    attributes:
      label: Why it is NOT exploitable
      description: |
        This is what decides the issue. Pick the reason and prove it: a compensating control
        that already exists, an unreachable path (dead code, disabled flag), data the attacker
        does not control, a sink that is not dangerous on that engine or version, or a trust
        boundary that sits earlier.
      placeholder: |
        req.query.id never reaches the query: the validateId middleware (src/mw/validate.ts:20)
        rejects with 400 any value that is not /^[0-9]+$/, and it is mounted for the whole
        /api/users* route. On top of that, the driver has used prepared statements by default since v9.
    validations:
      required: true
  - type: textarea
    id: stack-artifact
    attributes:
      label: Stack and minimal artifact to reproduce it
      description: "Language, framework and version, kind of audited artifact, and the minimal (redacted) fragment that triggers the false positive."
      render: text
      placeholder: |
        Artifact: Node/TypeScript repo (pnpm monorepo)
        Runtime: Node 20.11, Express 4.19, pg 8.11
        File: src/api/users.ts (redacted fragment below)
        ...
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Applicable standard ID
      description: "The identifier the squad invoked, or the one that would apply. Format: CWE-89, OWASP ASVS 5.3.4, MASVS-STORAGE-1, CAPEC-66. If none applies, write `none`."
      placeholder: "CWE-89"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity it was reported with
      description: "Matches the `severity/<value>` label."
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: "The value of `version` in .claude-plugin/plugin.json when you ran the audit."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Distribution channel
      options:
        - latest
        - stable
        - "installed by hand / not sure"
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: What should watch for it (optional, but it speeds up closing)
      description: "Propose the regression case: input, expected squad output, and where it would live (a gate or the case corpus)."
      placeholder: |
        Case: file with a parameter validated by an earlier middleware -> the web-api role must NOT emit CWE-89.
