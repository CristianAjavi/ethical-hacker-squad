# .github/dependabot.yml
#
# Solo hay UN ecosistema real en este repositorio: github-actions.
# No hay package.json, requirements.txt, go.mod ni Dockerfile, asi que no se
# declara ningun otro (un bloque para un ecosistema inexistente solo genera
# ruido y una falsa sensacion de cobertura).
#
# Por que esto es obligatorio aqui:
#   Este repo fija todas las acciones por SHA de 40 caracteres. GitHub documenta
#   que Dependabot NO crea alertas para acciones fijadas por SHA (solo para las
#   que usan versionado semantico), asi que el pin nos deja ciegos a las alertas.
#   Los *version updates* si mantienen esos SHA al dia — y conservan el
#   comentario `# vX.Y.Z` que va al lado del pin, que es lo que hace legible el
#   diff y lo que exige scripts/gates/gate-workflow-hardening.sh.
#   La otra mitad de la compensacion es .github/workflows/supply-chain-audit.yml,
#   que corre las auditorias en linea de zizmor (impostor-commit,
#   known-vulnerable-actions, stale-action-refs).
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Para github-actions el directorio es siempre la raiz: Dependabot busca
    # los workflows en .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    # Periodo de reposo antes de proponer una version recien publicada: si una
    # release sale comprometida y se retira, no habremos abierto ya el PR que
    # la introduce. Para github-actions solo esta soportado `default-days`.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Un unico PR agrupado por semana en vez de uno por accion.
    groups:
      github-actions:
        patterns:
          - "*"
