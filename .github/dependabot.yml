# .github/dependabot.yml
#
# There is only ONE real ecosystem in this repository: github-actions.
#
# There ARE two package.json files - bench/cases/node-supply and
# bench/cases/express-invoices - and no block is declared for them ON PURPOSE.
# They are PLANTED FIXTURES: `lodahs` is a character transposition of `lodash`
# declared in bench/ground-truth.json as a supply-chain case, and the express
# pin is deliberately old. Nothing installs them, they ship in no plugin, and a
# version-update block would open pull requests to "fix" the very defects the
# bench exists to detect.
#
# CONSEQUENCE, said out loud because it will surprise somebody: enabling
# vulnerability alerts makes GitHub report those two - one high, one low - and
# they cannot be filtered by path, because alerts are not configured here. They
# are true statements about fixtures and false statements about the product.
# Dismiss them as `not_used` if the noise trains anyone to ignore the channel;
# do not "fix" them, and do not let a real alert hide behind the assumption that
# every npm finding here is a fixture. There is no requirements.txt, go.mod or
# Dockerfile (a block for a nonexistent ecosystem only creates noise and a false
# sense of coverage).
#
# Why this is mandatory here:
#   This repo pins every action by 40-character SHA. GitHub documents that
#   Dependabot does NOT raise alerts for actions pinned by SHA (only for those
#   using semantic versioning), so the pin leaves us blind to alerts.
#   Version updates do keep those SHAs current - and they preserve the
#   `# vX.Y.Z` comment next to the pin, which is what makes the diff readable
#   and what scripts/gates/gate-workflow-hardening.sh requires.
#   The other half of the compensation is .github/workflows/supply-chain-audit.yml,
#   which runs the online zizmor audits (impostor-commit,
#   known-vulnerable-actions, stale-action-refs).
version: 2
updates:
  - package-ecosystem: "github-actions"
    # For github-actions the directory is always the root: Dependabot looks for
    # workflows in .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    # Resting period before proposing a freshly published version: if a release
    # ships compromised and is pulled, we will not already have opened the PR
    # that introduces it. For github-actions only `default-days` is supported.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # A single grouped PR per week instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
