# .github/dependabot.yml
#
# THE INVENTORY THIS COMMENT USED TO ASSERT WAS WRONG IN FOUR PLACES, and it is
# the file people read to decide whether an alert matters. Corrected 2026-09-01
# after measuring the five open alerts against the tree; the wrong version had
# stood since 2026-08-24. It said there was no requirements.txt (there is one,
# and it produces three of the five alerts), that alerts would report "those two
# - one high, one low" (five: one high, two medium, two low), that the express
# pin was "deliberately old" (`express` appears in NO planted entry and NO decoy
# in bench/ground-truth.json), and that there was no Dockerfile (there is one).
# Every claim of absence in this file is now transcribed into
# scripts/gates/data/alert-surface.json and checked by
# scripts/gates/gate-alert-surface.sh, which enumerates the manifests on DISK -
# because a list built from memory is exactly what failed here.
#
# THE MANIFESTS, and what an alert on each one means. The authoritative list is
# the data file; this is the summary a reader needs on the spot:
#
#   bench/cases/**            FIXTURES. npm, pip and docker. Nothing installs
#                             them, they ship in no plugin, and a version-update
#                             block would open pull requests to "fix" the very
#                             defects the bench exists to detect - or to bump a
#                             line the answer key pins by symbol AND version.
#                             ONE of the alerts here is ground truth: `lodahs`
#                             (P-20), a character transposition of `lodash`. The
#                             other four are incidental - pins that were current
#                             when the case was written and that the world later
#                             found CVEs in. Do not "fix" any of them.
#   tooling/claude-cli/**     REAL. The one place an alert would be a defect in
#                             something we ship a dependency on: it is installed
#                             with `npm ci` by .github/workflows/release.yml.
#                             It now has its own block, below.
#
# CONSEQUENCE, said out loud because it will surprise somebody: alerts cannot be
# filtered by path, because alerts are not configured here. Dismiss the fixture
# ones as `not_used` if the noise trains anyone to ignore the channel; do NOT let
# a real alert hide behind the assumption that everything here is a fixture. That
# sentence was in the previous version too, and the previous version was itself
# the hiding place - which is why the assumption is now a checked list and not a
# sentence. There is no go.mod and no Gemfile (a block for a nonexistent
# ecosystem only creates noise and a false sense of coverage).
#
# Why this is mandatory here:
#   This repo pins every action by 40-character SHA. GitHub documents that
#   Dependabot does NOT raise alerts for actions pinned by SHA (only for those
#   using semantic versioning), so the pin leaves us blind to alerts.
#   Version updates do keep those SHAs current - and they preserve the
#   `# vX.Y.Z` comment next to the pin, which is what makes the diff readable
#   and what scripts/gates/gate-workflow-hardening.sh requires.
#   The other half of the compensation is .github/workflows/supply-chain-audit.yml,
#   which runs the online zizmor audits (impostor-commit,
#   known-vulnerable-actions, stale-action-refs).
version: 2
updates:
  - package-ecosystem: "github-actions"
    # For github-actions the directory is always the root: Dependabot looks for
    # workflows in .github/workflows.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    # Resting period before proposing a freshly published version: if a release
    # ships compromised and is pulled, we will not already have opened the PR
    # that introduces it. For github-actions only `default-days` is supported.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # A single grouped PR per week instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"

  # The Claude Code CLI lock file. Unmanaged until 2026-09-01, which was an
  # omission and not a decision: the argument this file already makes for
  # keeping action SHAs current - a pin nobody refreshes goes stale in silence -
  # applies to the one third-party tool the release workflow actually installs,
  # and nobody had made it. `npm ci` here resolves to a recorded integrity hash,
  # so what needs maintaining is the recorded version, and that is what a
  # version-update block does. Scoped to this directory so it can never reach
  # bench/cases/**.
  - package-ecosystem: "npm"
    directory: "/tooling/claude-cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
