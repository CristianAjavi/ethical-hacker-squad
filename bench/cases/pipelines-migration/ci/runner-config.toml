concurrent = 6
check_interval = 3

[[runners]]
  name = "shared-docker-01"
  url = "https://gitlab.example.com/"
  executor = "docker"
  [runners.docker]
    image = "node:20-bookworm"
    privileged = true
    volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]

[[runners]]
  name = "release-ephemeral-01"
  url = "https://gitlab.example.com/"
  executor = "docker+machine"
  access_level = "ref_protected"
  [runners.docker]
    image = "node:20-bookworm"
    privileged = false
    volumes = ["/cache"]
  [runners.machine]
    IdleCount = 0
    MaxBuilds = 1
