trigger:
  branches:
    include: [main]

pr: none

pool:
  vmImage: windows-2022

variables:
  - group: windows-signing
  - name: buildConfiguration
    value: Release

steps:
  - task: UseDotNet@2
    inputs:
      version: '8.0.x'

  - script: dotnet build --configuration $(buildConfiguration)
    displayName: Build

  - script: dotnet test --configuration $(buildConfiguration) --logger trx
    displayName: Test

  - task: DotNetCoreCLI@2
    displayName: Sign and pack
    inputs:
      command: pack
      packagesToPack: src/Agent/Agent.csproj
